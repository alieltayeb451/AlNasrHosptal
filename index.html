<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستشفى النصر التخصصي | النظام الإلكتروني المتكامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1F3D;
  --ink-2:#16294D;
  --crimson:#C81E45;
  --crimson-dark:#8F1332;
  --crimson-glow:rgba(200,30,69,.35);
  --ivory:#FBF8F4;
  --card:#FFFFFF;
  --teal:#177C74;
  --teal-tint:#E4F1EF;
  --slate:#5B6472;
  --slate-light:#8992A0;
  --rose:#F6E5E9;
  --line:#E9E1DA;
  --line-2:#E2E7ED;
  --amber:#B9791A;
  --amber-tint:#FBF0DE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ivory);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4,.display{font-family:'Cairo',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:'Cairo',sans-serif;cursor:pointer;border:none;}
input,select,textarea{font-family:'Tajawal',sans-serif;}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--crimson);outline-offset:2px;
}
::selection{background:var(--crimson-glow);}

/* ---------- Utility ---------- */
.container{max-width:1180px;margin:0 auto;padding:0 28px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 26px;border-radius:10px;font-weight:700;font-size:15px;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--crimson);color:#fff;box-shadow:0 10px 24px -8px var(--crimson-glow);}
.btn-primary:hover{background:var(--crimson-dark);}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55);}
.btn-outline:hover{background:rgba(255,255,255,.12);}
.btn-ghost{background:var(--rose);color:var(--crimson-dark);}
.btn-ghost:hover{background:#efd3da;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:#12655e;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn-line{background:#fff;border:1.5px solid var(--line-2);color:var(--ink);}
.btn-line:hover{border-color:var(--slate-light);}
.btn-danger{background:#fff;color:var(--crimson-dark);border:1.5px solid var(--rose);}
.btn-danger:hover{background:var(--rose);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font-size:12.5px;font-weight:700;}
.pill-teal{background:var(--teal-tint);color:var(--teal);}
.pill-amber{background:var(--amber-tint);color:var(--amber);}
.pill-rose{background:var(--rose);color:var(--crimson-dark);}
.pill-slate{background:#EEF1F5;color:var(--slate);}

/* ---------- Pulse / signature element ---------- */
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--crimson);position:relative;flex:none;}
.pulse-dot::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--crimson);
  animation:pulseRing 1.8s ease-out infinite;
}
@keyframes pulseRing{0%{transform:scale(.4);opacity:.9;}100%{transform:scale(1.9);opacity:0;}}
.ekg-wrap{width:100%;overflow:hidden;line-height:0;}
.ekg-line{width:200%;height:auto;display:block;}
.ekg-path{
  fill:none;stroke:var(--crimson);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px var(--crimson-glow));
}
@media (prefers-reduced-motion: no-preference){
  .ekg-line{animation:ekgScroll 7s linear infinite;}
}
@keyframes ekgScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ---------- Landing ---------- */
.hero{background:radial-gradient(120% 140% at 20% -10%, var(--ink-2) 0%, var(--ink) 55%, #081226 100%);color:#fff;position:relative;}
.hero-top{display:flex;align-items:center;justify-content:space-between;padding:24px 0;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;}
.brand-mark{width:34px;height:34px;flex:none;}
.hero-nav-actions{display:flex;gap:10px;}
.hero-body{padding:56px 0 40px;text-align:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;color:#F2C9D3;font-weight:700;font-size:13px;letter-spacing:.03em;margin-bottom:18px;}
.hero-title{font-size:44px;line-height:1.28;font-weight:900;margin:0 0 16px;}
.hero-title span{color:#F2839B;}
.hero-sub{color:#C7CEDD;font-size:17px;max-width:620px;margin:0 auto 30px;line-height:1.9;}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.12);border-radius:14px;overflow:hidden;margin-top:8px;}
.hero-stat{background:rgba(255,255,255,.04);padding:20px 10px;text-align:center;}
.hero-stat b{display:block;font-family:'Cairo',sans-serif;font-size:26px;font-weight:800;color:#fff;}
.hero-stat span{font-size:12.5px;color:#AEB7C9;}

.section{padding:64px 0;}
.section-head{text-align:center;max-width:600px;margin:0 auto 38px;}
.eyebrow{color:var(--crimson);font-weight:700;font-size:12.5px;letter-spacing:.05em;margin-bottom:8px;display:block;}
.section-title{font-size:28px;font-weight:800;margin:0 0 10px;}
.section-desc{color:var(--slate);font-size:15px;line-height:1.8;}

.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.svc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;transition:border-color .15s, transform .15s;}
.svc-card:hover{border-color:var(--crimson);transform:translateY(-3px);}
.svc-num{font-family:'JetBrains Mono',monospace;color:var(--crimson);font-size:13px;font-weight:600;margin-bottom:14px;display:block;}
.svc-card h3{font-size:17px;margin:0 0 8px;}
.svc-card p{color:var(--slate);font-size:13.5px;line-height:1.8;margin:0;}

.book-band{background:var(--teal);border-radius:20px;padding:38px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#fff;}
.book-band h3{margin:0 0 6px;font-size:22px;}
.book-band p{margin:0;color:#D6ECE9;font-size:14px;}

footer{background:var(--ink);color:#AEB7C9;padding:38px 0;font-size:13.5px;}
.footer-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;}
.footer-grid b{color:#fff;}

/* ---------- Auth / booking screens ---------- */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(160deg,var(--ink) 0%, #081226 100%);}
.auth-card{background:#fff;border-radius:20px;width:100%;max-width:460px;padding:38px 34px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);}
.auth-back{display:inline-flex;align-items:center;gap:6px;color:var(--slate);font-size:13.5px;font-weight:700;margin-bottom:18px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.role-opt{border:1.5px solid var(--line-2);border-radius:12px;padding:14px 10px;text-align:center;font-weight:700;font-size:13.5px;color:var(--slate);transition:.15s;background:#fff;}
.role-opt.active{border-color:var(--crimson);background:var(--rose);color:var(--crimson-dark);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--line-2);font-size:14.5px;background:#fbfbfc;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--crimson);background:#fff;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hint{font-size:12px;color:var(--slate-light);margin-top:4px;}
.err{color:var(--crimson-dark);font-size:13px;font-weight:700;background:var(--rose);padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.ok-banner{color:var(--teal);font-size:13.5px;font-weight:700;background:var(--teal-tint);padding:10px 12px;border-radius:8px;margin-bottom:14px;}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:250px;flex:none;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 0;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 22px 20px;font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px;}
.sidebar-brand small{display:block;font-family:'Tajawal',sans-serif;font-weight:400;font-size:11px;color:#9AA4BB;}
.nav-item{display:block;padding:12px 22px;font-size:14px;font-weight:700;color:#C7CEDD;border-right:3px solid transparent;transition:.15s;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.04);}
.nav-item.active{color:#fff;background:rgba(200,30,69,.16);border-right-color:var(--crimson);}
.sidebar-foot{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,.1);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--crimson);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;}
.user-meta b{display:block;font-size:13px;}
.user-meta span{font-size:11.5px;color:#9AA4BB;}

.main{flex:1;min-width:0;background:var(--ivory);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5;}
.topbar h2{margin:0;font-size:19px;}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--slate);}
.content{padding:26px 30px 60px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.stat-card span{font-size:12.5px;color:var(--slate);font-weight:700;}
.stat-card b{display:block;font-family:'Cairo',sans-serif;font-size:26px;margin-top:6px;}

.panel{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
.panel-head h3{margin:0;font-size:16.5px;}
.panel-body{padding:20px 22px;}
.panel-body.tight{padding:0;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:right;color:var(--slate);font-weight:700;font-size:12.5px;padding:10px 22px;background:#FAFAFB;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:13px 22px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FCFAF8;}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap;}
.empty-row td{text-align:center;color:var(--slate-light);padding:34px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
.bar-list .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-row .bar-label{width:150px;font-size:13px;color:var(--slate);font-weight:700;flex:none;}
.bar-track{flex:1;height:10px;background:#EFEFF3;border-radius:100px;overflow:hidden;}
.bar-fill{height:100%;background:var(--crimson);border-radius:100px;}
.bar-row .bar-val{width:30px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--slate);}

.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;}
.tag-navy{background:#E9EDF6;color:var(--ink);}

@media (max-width:980px){
  .services-grid{grid-template-columns:1fr 1fr;}
  .hero-stats{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;padding:12px 0;}
  .sidebar-brand,.sidebar-foot{display:none;}
  .nav-item{border-right:none;border-bottom:3px solid transparent;white-space:nowrap;}
  .nav-item.active{border-bottom-color:var(--crimson);}
  .services-grid{grid-template-columns:1fr;}
  .hero-title{font-size:30px;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   مستشفى القلب التخصصي -- النظام الإلكتروني المتكامل
   تطبيق واحد (SPA) يعمل بالكامل من جهة العميل، مع تخزين
   مشترك عبر window.storage بحيث تتزامن البيانات بين الأدوار.
   ========================================================= */

const STORE_KEY = 'heart-hospital-db-v1';

let DB = null;
let state = {
  view: 'landing',       // landing | book | login | app
  currentUser: null,     // {id,name,role}
  module: null,
  bookOk: false,
  loginError: '',
  loginRoleTab: 'admin',
  flash: ''
};

/* ---------------- Utilities ---------------- */
function genId(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '--'; const parts = d.split('-'); return parts.length===3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : d; }
function money(n){ return Number(n||0).toLocaleString('en-US') + ' ر.س'; }

async function loadDB(){
  try{
    const res = await window.storage.get(STORE_KEY, true);
    if(res && res.value){ DB = JSON.parse(res.value); return; }
    throw new Error('no data');
  }catch(e){
    DB = seedDB();
    await saveDB();
  }
}
async function saveDB(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(DB), true); }
  catch(e){ console.error('storage error', e); }
}

function seedDB(){
  const today = todayStr();
  const departments = [

    {id:'dep-4', name:'العيادات الخارجية', desc:'الاستشارات والفحوصات غير الطارئة'},
    {id:'dep-5', name:'الطوارئ القلبية', desc:'استقبال الحالات الحرجة على مدار الساعة'},
    {id:'dep-6', name:'العناية المركزة القلبية', desc:'متابعة الحالات الحرجة بعد العمليات والقسطرة'}
  ];
  const doctors = [
    {id:'doc-1', name:'د. سالم الحربي', specialty:'استشاري قلب وشرايين', depId:'dep-1', days:'الأحد، الثلاثاء، الخميس', phone:'0501112233'},
    {id:'doc-2', name:'د. نورة العتيبي', specialty:'استشارية قسطرة قلبية', depId:'dep-2', days:'السبت، الاثنين، الأربعاء', phone:'0502223344'},
    {id:'doc-3', name:'د. فيصل القحطاني', specialty:'جراح قلب وصدر', depId:'dep-3', days:'الأحد، الأربعاء', phone:'0503334455'},
    {id:'doc-4', name:'د. هند الزهراني', specialty:'أخصائية عيادات خارجية', depId:'dep-4', days:'يوميًا', phone:'0504445566'},
    {id:'doc-5', name:'د. عبدالله المطيري', specialty:'استشاري عناية مركزة قلبية', depId:'dep-6', days:'مناوبات', phone:'0505556677'}
  ];
  const patients = [

    {id:'pat-3', name:'خالد ناصر الدوسري', phone:'0559988776', age:63, gender:'ذكر', records:[{doctorId:'doc-2', date:today, note:'أجريت قسطرة تشخيصية، النتائج طبيعية.'}]}
  ];
  const appointments = [
    {id:'apt-1', patientName:'محمد أحمد العلي', phone:'0551234567', depId:'dep-1', doctorId:'doc-1', date:today, time:'09:30', status:'confirmed', notes:''},
    {id:'apt-2', patientName:'فاطمة سعيد الغامدي', phone:'0557654321', depId:'dep-4', doctorId:'doc-4', date:today, time:'11:00', status:'pending', notes:''},
    {id:'apt-3', patientName:'خالد ناصر الدوسري', phone:'0559988776', depId:'dep-2', doctorId:'doc-2', date:today, time:'13:15', status:'checked-in', notes:''}
  ];
  const invoices = [
    {id:'inv-1', patientName:'محمد أحمد العلي', service:'استشارة + تخطيط قلب', amount:450, status:'paid', date:today},
    {id:'inv-2', patientName:'خالد ناصر الدوسري', service:'قسطرة تشخيصية', amount:6200, status:'unpaid', date:today}
  ];
  const employees = [
    {id:'emp-1', name:'د. سالم الحربي', role:'طبيب', department:'قسم القلب والشرايين', phone:'0501112233', salary:38000, status:'نشط'},
    {id:'emp-2', name:'د. نورة العتيبي', role:'طبيب', department:'قسم القسطرة القلبية', phone:'0502223344', salary:41000, status:'نشط'},
    {id:'emp-3', name:'سارة القرني', role:'استقبال', department:'العيادات الخارجية', phone:'0561112233', salary:6500, status:'نشط'},
    {id:'emp-4', name:'ريم الشهري', role:'محاسبة', department:'الحسابات', phone:'0562223344', salary:8200, status:'نشط'},
    {id:'emp-5', name:'بندر السبيعي', role:'شؤون عاملين', department:'الموارد البشرية', phone:'0563334455', salary:7800, status:'نشط'},
    {id:'emp-6', name:'منى الحارثي', role:'تمريض', department:'العناية المركزة القلبية', phone:'0564445566', salary:9500, status:'نشط'}
  ];
  const users = [
    {id:'usr-1', username:'admin', password:'admin123', name:'مدير النظام', role:'admin'},
    {id:'usr-2', username:'reception', password:'1234', name:'سارة القرني', role:'reception'},
    {id:'usr-3', username:'salem', password:'1234', name:'د. سالم الحربي', role:'doctor', doctorId:'doc-1'},
    {id:'usr-4', username:'noura', password:'1234', name:'د. نورة العتيبي', role:'doctor', doctorId:'doc-2'},
    {id:'usr-5', username:'accounts', password:'1234', name:'ريم الشهري', role:'accountant'},
    {id:'usr-6', username:'hr', password:'1234', name:'بندر السبيعي', role:'hr'}
  ];
  return {departments, doctors, patients, appointments, invoices, employees, users, attendance:{}};
}

/* ---------------- Role config ---------------- */
const ROLE_LABELS = {admin:'مدير النظام', reception:'الاستقبال', doctor:'طبيب', accountant:'الحسابات', hr:'شؤون العاملين'};
const NAV_CONFIG = {
  admin:[
    {key:'overview', label:'لوحة المعلومات'},
    {key:'appointments', label:'المواعيد'},
    {key:'reception', label:'الاستقبال'},
    {key:'doctors', label:'الأطباء'},
    {key:'patients', label:'المرضى'},
    {key:'accounts', label:'الحسابات'},
    {key:'staff', label:'العاملون'},
    {key:'departments', label:'الأقسام'},
    {key:'users', label:'المستخدمون والصلاحيات'}
  ],
  reception:[
    {key:'overview', label:'لوحة المعلومات'},
    {key:'appointments', label:'المواعيد'},
    {key:'reception', label:'الاستقبال'},
    {key:'patients', label:'المرضى'}
  ],
  doctor:[

const app = {
  goto(view){ state.view = view; state.loginError=''; render(); window.scrollTo(0,0); },
  gotoModule(key){ state.module = key; render(); },

  async submitBooking(e){
    e.preventDefault();
    const f = e.target;
    const depId = f.dep.value;
    const doctorId = f.doctor.value;
    const apt = {
      id: genId('apt'),
      patientName: f.name.value.trim(),
      phone: f.phone.value.trim(),
      depId, doctorId,
      date: f.date.value,
      time: f.time.value,
      status: 'pending',
      notes: f.notes.value.trim()
    };
    if(!apt.patientName || !apt.phone || !depId || !apt.date || !apt.time){ return false; }
    DB.appointments.push(apt);
    if(!DB.patients.some(p => p.phone === apt.phone)){
      DB.patients.push({id:genId('pat'), name:apt.patientName, phone:apt.phone, age:'', gender:'', records:[]});
    }
    await saveDB();
    state.bookOk = true;
    render();
    return false;
  },

  selectLoginRole(role){ state.loginRoleTab = role; render(); },

  async submitLogin(e){
    e.preventDefault();
    const f = e.target;
    const username = f.username.value.trim();
    const password = f.password.value;
    const user = DB.users.find(u => u.username === username && u.password === password && u.role === state.loginRoleTab);
    if(!user){ state.loginError = 'بيانات الدخول غير صحيحة، أو لا تطابق الدور المحدد.'; render(); return false; }
    state.currentUser = user;
    state.loginError = '';
    state.module = NAV_CONFIG[user.role][0].key;
    state.view = 'app';
    render();
    return false;
  },

  logout(){ state.currentUser = null; state.view='landing'; state.module=null; render(); },

  /* ---- generic mutations ---- */
  async updateAppointmentStatus(id, status){
    const a = DB.appointments.find(x=>x.id===id); if(a) a.status = status;
    await saveDB(); render();
  },
  async deleteAppointment(id){
    DB.appointments = DB.appointments.filter(a=>a.id!==id);
    await saveDB(); render();
  },
  async addAppointment(e){
    e.preventDefault(); const f=e.target;
    DB.appointments.push({
      id:genId('apt'), patientName:f.name.value.trim(), phone:f.phone.value.trim(),
      depId:f.dep.value, doctorId:f.doctor.value, date:f.date.value, time:f.time.value,
      status:'confirmed', notes:f.notes.value.trim()
    });
    if(!DB.patients.some(p=>p.phone===f.phone.value.trim())){
      DB.patients.push({id:genId('pat'), name:f.name.value.trim(), phone:f.phone.value.trim(), age:'', gender:'', records:[]});
    }
    await saveDB(); f.reset(); render();
    return false;
  },
  async addPatientQuick(e){
    e.preventDefault(); const f=e.target;
    DB.patients.push({id:genId('pat'), name:f.name.value.trim(), phone:f.phone.value.trim(), age:f.age.value||'', gender:f.gender.value||'', records:[]});
    await saveDB(); f.reset(); render();
    return false;
  },
  async addDoctorNote(patientId, doctorId, text){
    if(!text) return;
    const p = DB.patients.find(x=>x.id===patientId);
    if(p){ p.records.push({doctorId, date:todayStr(), note:text}); await saveDB(); render(); }
  },
  async addDoctor(e){
    e.preventDefault(); const f=e.target;
    DB.doctors.push({id:genId('doc'), name:f.name.value.trim(), specialty:f.specialty.value.trim(), depId:f.dep.value, days:f.days.value.trim(), phone:f.phone.value.trim()});
    await saveDB(); f.reset(); render(); return false;
  },
  async deleteDoctor(id){ DB.doctors = DB.doctors.filter(d=>d.id!==id); await saveDB(); render(); },
  async addDepartment(e){
    e.preventDefault(); const f=e.target;
    DB.departments.push({id:genId('dep'), name:f.name.value.trim(), desc:f.desc.value.trim()});
    await saveDB(); f.reset(); render(); return false;
  },
  async deleteDepartment(id){ DB.departments = DB.departments.filter(d=>d.id!==id); await saveDB(); render(); },
  async addInvoice(e){
    e.preventDefault(); const f=e.target;
    DB.invoices.push({id:genId('inv'), patientName:f.patientName.value.trim(), service:f.service.value.trim(), amount:Number(f.amount.value||0), status:'unpaid', date:todayStr()});
    await saveDB(); f.reset(); render(); return false;
  },
  async markInvoicePaid(id){ const i=DB.invoices.find(x=>x.id===id); if(i) i.status='paid'; await saveDB(); render(); },
  async deleteInvoice(id){ DB.invoices = DB.invoices.filter(i=>i.id!==id); await saveDB(); render(); },
  async addEmployee(e){
    e.preventDefault(); const f=e.target;
    DB.employees.push({id:genId('emp'), name:f.name.value.trim(), role:f.role.value.trim(), department:f.department.value.trim(), phone:f.phone.value.trim(), salary:Number(f.salary.value||0), status:'نشط'});
    await saveDB(); f.reset(); render(); return false;
  },
  async toggleEmployeeStatus(id){
    const e2 = DB.employees.find(x=>x.id===id); if(e2) e2.status = e2.status==='نشط' ? 'متوقف':'نشط';
    await saveDB(); render();
  },
  async deleteEmployee(id){ DB.employees = DB.employees.filter(e=>e.id!==id); await saveDB(); render(); },
  async toggleAttendance(empId){
    const d = todayStr();
    if(!DB.attendance[d]) DB.attendance[d] = {};
    DB.attendance[d][empId] = !DB.attendance[d][empId];
    await saveDB(); render();
  },
  async addUser(e){
    e.preventDefault(); const f=e.target;
    DB.users.push({id:genId('usr'), username:f.username.value.trim(), password:f.password.value, name:f.name.value.trim(), role:f.role.value});
    await saveDB(); f.reset(); render(); return false;
  },
  async deleteUser(id){
    if(DB.users.length<=1) return;
    DB.users = DB.users.filter(u=>u.id!==id); await saveDB(); render();
  }
};
window.app = app;

        <div class="field"><label>القسم</label><select name="dep" required><option value="">اختر</option>${DB.departments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>
        <div class="field"><label>الطبيب</label><select name="doctor" required><option value="">اختر</option>${DB.doctors.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>
        <div class="field"><label>التاريخ</label><input type="date" name="date" required></div>
        <div class="field"><label>الوقت</label><input type="time" name="time" required></div>
        <div class="field full"><label>ملاحظات</label><textarea name="notes" rows="2"></textarea></div>
        <div class="full"><button class="btn btn-primary" type="submit">إضافة الموعد</button></div>
      </form>
    </div>
  </div>` : ''}
  <div class="panel">
    <div class="panel-head"><h3>${readOnlyDoctorId ? 'كل مواعيدك' : 'جميع المواعيد'}</h3></div>
    <div class="panel-body tight">
      <table><thead><tr><th>المريض</th><th>الجوال</th><th>القسم</th>${readOnlyDoctorId?'':'<th>الطبيب</th>'}<th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody>
        ${sorted.length ? sorted.map(a=>`
          <tr>
            <td>${esc(a.patientName)}</td><td class="mono">${esc(a.phone)}</td><td>${esc(depName(a.depId))}</td>
            ${readOnlyDoctorId?'':`<td>${esc(doctorName(a.doctorId))}</td>`}
            <td class="mono">${fmtDate(a.date)}</td><td class="mono">${a.time}</td><td>${statusPill(a.status)}</td>
            <td class="actions-cell">
              ${a.status!=='confirmed' ? `<button class="btn btn-sm btn-teal" onclick="app.updateAppointmentStatus('${a.id}','confirmed')">تأكيد</button>`:''}
              ${a.status!=='done' ? `<button class="btn btn-sm btn-ghost" onclick="app.updateAppointmentStatus('${a.id}','done')">إنهاء</button>`:''}
              ${a.status!=='cancelled' ? `<button class="btn btn-sm btn-danger" onclick="app.updateAppointmentStatus('${a.id}','cancelled')">إلغاء</button>`:''}
              ${!readOnlyDoctorId ? `<button class="btn btn-sm btn-line" onclick="app.deleteAppointment('${a.id}')">حذف</button>`:''}
            </td>
          </tr>`).join('') : `<tr class="empty-row"><td colspan="8">لا توجد مواعيد.</td></tr>`}
      </tbody></table>
    </div>
  </div>`;
}

function modulePatients(){
  return `

function moduleMyPatients(doctorId){
  const patients = DB.patients.filter(p => p.records.some(r=>r.doctorId===doctorId) || DB.appointments.some(a=>a.doctorId===doctorId && a.phone===p.phone));
  return `
  <div class="panel">
    <div class="panel-head"><h3>مرضاي</h3></div>
    <div class="panel-body tight">
      <table><thead><tr><th>المريض</th><th>الجوال</th><th>آخر ملاحظة</th><th>إضافة ملاحظة</th></tr></thead>
      <tbody>
        ${patients.length ? patients.map(p=>{
          const mine = p.records.filter(r=>r.doctorId===doctorId);
          const last = mine[mine.length-1];
          const noteId = 'note-'+p.id;
          return `<tr>
            <td>${esc(p.name)}</td><td class="mono">${esc(p.phone)}</td>
            <td style="max-width:220px;">${last? esc(last.note) : '--'}</td>
            <td>
              <div style="display:flex;gap:6px;">
                <input id="${noteId}" placeholder="ملاحظة أو وصفة..." style="padding:8px 10px;border-radius:8px;border:1.5px solid var(--line-2);font-size:13px;flex:1;">
                <button class="btn btn-sm btn-primary" onclick="app.addDoctorNote('${p.id}','${doctorId}', document.getElementById('${noteId}').value); document.getElementById('${noteId}').value=''">حفظ</button>
              </div>
            </td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="4">لا يوجد مرضى مرتبطون بك حتى الآن.</td></tr>`}
      </tbody></table>
    </div>
  </div>`;
}

function moduleAccounts(){

  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="stat-card"><span>إجمالي المحصّل</span><b class="mono" style="color:var(--teal);">${money(totalPaid)}</b></div>
    <div class="stat-card"><span>مستحقات غير مسددة</span><b class="mono" style="color:var(--crimson);">${money(totalUnpaid)}</b></div>
    <div class="stat-card"><span>عدد الفواتير</span><b>${DB.invoices.length}</b></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>إصدار فاتورة جديدة</h3></div>

    <div class="panel-head"><h3>الفواتير</h3></div>

      <table><thead><tr><th>المريض</th><th>الخدمة</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th><th>إجراء</th></tr></thead>

function moduleContent(){
  const u = state.currentUser;
  const key = state.module;
  if(key==='overview') return moduleOverview();
  if(key==='appointments' && (u.role==='admin'||u.role==='reception')) return moduleAppointments(null);
  if(key==='reception' && (u.role==='admin'||u.role==='reception')) return moduleReception();
  if(key==='doctors' && u.role==='admin') return moduleDoctors();
  if(key==='patients' && (u.role==='admin'||u.role==='reception')) return modulePatients();
  if(key==='accounts' && (u.role==='admin'||u.role==='accountant')) return moduleAccounts();
  if(key==='staff' && (u.role==='admin'||u.role==='hr')) return moduleStaff();
  if(key==='attendance' && u.role==='hr') return moduleAttendance();
  if(key==='departments' && u.role==='admin') return moduleDepartments();
  if(key==='users' && u.role==='admin') return moduleUsers();
  if(key==='myAppointments' && u.role==='doctor') return moduleAppointments(u.doctorId);
  if(key==='myPatients' && u.role==='doctor') return moduleMyPatients(u.doctorId);
  return `<div class="panel"><div class="panel-body">لا تملك صلاحية الوصول لهذه الصفحة.</div></div>`;
}

function viewApp(){
  return `
  <div class="shell">
    ${sidebar()}
    <div class="main">
      <div class="topbar">
        <h2>${moduleTitle(state.module)}</h2>
        <div class="topbar-right">
          <span class="pulse-dot"></span> النظام متصل
        </div>
      </div>
      <div class="content">${moduleContent()}</div>
    </div>
  </div>`;
}

/* ---------------- Root render ---------------- */
function render(){
  const root = document.getElementById('app');
  if(!DB){ root.innerHTML = '<div class="center-screen"><span style="color:#fff;">... جاري تحميل النظام</span></div>'; return; }
  if(state.view==='landing') root.innerHTML = viewLanding();
  else if(state.view==='book') root.innerHTML = viewBook();
  else if(state.view==='login') root.innerHTML = viewLogin();
  else if(state.view==='app' && state.currentUser) root.innerHTML = viewApp();
  else { state.view='landing'; root.innerHTML = viewLanding(); }
}

(async function init(){
  await loadDB();
  render();
})();
</script>
</body>
</html>
